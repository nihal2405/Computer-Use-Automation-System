[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-use-automation"
version = "0.0.1"
description = "Scaffold for a UI discovery and deterministic replay system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
computer-use = "computer_use.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
